services:
  postgres:
    image: postgres:13.3
    container_name: deal-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ilya
      POSTGRES_PASSWORD: "123"
    ports:
      - "5433:5432"
    networks:
      - app-net

  zookeeper:
    image: docker.io/bitnami/zookeeper:3.6.1
    container_name: deal-zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: yes
    networks:
      - app-net

  kafka:
    image: docker.io/bitnami/kafka:2.5.0
    container_name: deal-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      ALLOW_PLAINTEXT_LISTENER: yes
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://host.docker.internal:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    networks:
      - app-net

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: deal-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
      - zookeeper
    networks:
      - app-net

  calculator:
    build:
      context: ./calculator
      dockerfile: Dockerfile
    container_name: calculator-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - app-net

  deal:
    build:
      context: ./deal
      dockerfile: Dockerfile
    container_name: deal-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: ilya
      SPRING_DATASOURCE_PASSWORD: "123"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - app-net

  dossier:
    build:
      context: ./dossier
      dockerfile: Dockerfile
    container_name: dossier-service
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - app-net

  statement:
    build:
      context: ./statement
      dockerfile: Dockerfile
    container_name: statement-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - app-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - app-net

networks:
  app-net:
    driver: bridge