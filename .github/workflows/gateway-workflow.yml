name: gateway-workflow.yml
on:
  push:
    branches: [master, develop, MVP-6]
    paths:
      - 'gateway/**'
  pull_request:
    branches: [master, develop, MVP-6]
    paths:
      - 'gateway/**'

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build & Test
        run: mvn clean verify -B

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=iljaKorn_NeoflexProject \
            -Dsonar.moduleKey=gateway-service \
            -Dsonar.projectBaseDir=$GITHUB_WORKSPACE \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportPaths=target/surefire-reports

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: gateway/target/site/jacoco/jacoco.xml
          flag-name: gateway-service
          fail-on-error: false

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: gateway-service-jar
          path: gateway/target/*.jar
          retention-days: 7